services:
  ticking-db:
    image: postgres:18-alpine
    container_name: ticking-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ticking_db
    ports:
      - "5432:5432"
    volumes:
      - ticking_postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "ticking_db"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - ticking-network

  ticking-api:
    build:
      context: ./ticking-api
      dockerfile: Dockerfile
    container_name: ticking-api
    ports:
      - "5080:5080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5080
      - ConnectionStrings__PostgresConnection=Host=ticking-db;Port=5432;Database=ticking_db;Username=postgres;Password=postgres
    depends_on:
      ticking-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ticking-network

  ticking-web:
    build:
      context: ./ticking-web
      dockerfile: Dockerfile
    container_name: ticking-web
    ports:
      - "3008:3008"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5080
    depends_on:
      - ticking-api
    restart: unless-stopped
    networks:
      - ticking-network

volumes:
  ticking_postgres_data:

networks:
  ticking-network:
    driver: bridge



